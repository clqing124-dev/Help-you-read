<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帮你读书 - 渐进阅读法 | AI智能精读</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fb;
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            line-height: 1.5;
            padding: 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .lang-toggle {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 0.25rem;
            background: #e9eef3;
            padding: 0.25rem;
            border-radius: 40px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            padding: 0.35rem 0.9rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
            font-family: inherit;
            transition: 0.15s;
        }

        .lang-btn.active {
            background: white;
            color: #1e3c72;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1E3C72, #2A5298);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .badge {
            background: #e9eef3;
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .intro {
            max-width: 700px;
            margin: 1.25rem auto 0;
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.9;
        }

        .upload-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 24px;
            background: #fafcff;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-area:hover {
            border-color: #3b82f6;
            background: #f0f9ff;
        }

        .upload-icon {
            font-size: 3rem;
            color: #3b82f6;
            margin-bottom: 0.75rem;
        }

        .file-info {
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #0f3b5c;
        }

        .format-hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.5rem;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.8rem;
        }

        .btn {
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary {
            background: #1e3c72;
            color: white;
        }

        .btn-primary:hover {
            background: #0f2b4f;
        }

        .btn-outline {
            background: #f1f5f9;
            color: #1e293b;
        }

        .btn-outline:hover {
            background: #e2e8f0;
        }

        .report-container {
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
            padding: 1.8rem 2rem;
            border: 1px solid #eef2f6;
        }

        .report-header {
            border-bottom: 2px solid #eef2ff;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .export-btns {
            margin-top: 0.75rem;
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .btn-sm {
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #1e3c72;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .analysis-content {
            line-height: 1.7;
        }

        .analysis-content h1,
        .analysis-content h2 {
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: #0f172a;
        }

        .analysis-content h2 {
            border-left: 4px solid #1e3c72;
            padding-left: 1rem;
        }

        .analysis-content h3 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #334155;
        }

        .analysis-content ul,
        .analysis-content ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .analysis-content p {
            margin-bottom: 0.75rem;
        }

        .analysis-content code {
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .analysis-content table {
            border-collapse: collapse;
            margin: 1rem 0;
            width: 100%;
            font-size: 0.9rem;
        }

        .analysis-content th,
        .analysis-content td {
            border: 1px solid #e2e8f0;
            padding: 0.5rem 0.75rem;
            text-align: left;
            vertical-align: top;
        }

        .analysis-content th {
            background: #f1f5f9;
            font-weight: 600;
        }

        .analysis-content blockquote {
            border-left: 3px solid #93c5fd;
            margin: 0.75rem 0;
            padding: 0.5rem 1rem;
            background: #f8fafc;
            color: #475569;
        }

        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #6c86a3;
            margin-top: 2rem;
        }

        @media (max-width: 680px) {
            body {
                padding: 1rem;
            }

            .upload-card,
            .report-container {
                padding: 1.2rem;
            }

            .lang-toggle {
                position: static;
                justify-content: center;
                margin-bottom: 1rem;
            }
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #reportContainer, #reportContainer * {
                visibility: visible;
            }
            #reportContainer {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none;
                border: none;
            }
            .lang-toggle, .upload-card, .export-btns {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="hero">
            <div class="lang-toggle">
                <button class="lang-btn active" data-lang="zh">中文</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
            <h1 data-i18n="heroTitle">📖 帮你读书</h1>
            <div class="badge" data-i18n="badge">⚡ 基于 DeepSeek AI + 渐进阅读法 · 智能精读引擎</div>
            <div class="intro" data-i18n="intro">书海千千万，哪本是你该读的呢？你是否拿不定主意，是否该花时间去完整阅读这本书，又或者你只是想知道这本书的核心内容？把书喂给我吧，基于《如何阅读一本书》中的四层阅读层次提取的阅读方法，我将给你一份详尽的阅读报告，看完你就能立刻做出决断了。</div>
        </div>

        <div class="upload-card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                <p><strong data-i18n="uploadPrompt">点击或拖拽上传书籍文档</strong></p>
                <p style="font-size: 0.85rem; color: #64748b;" data-i18n="formats">支持 EPUB、文字版 PDF、TXT、Word、MOBI</p>
                <input type="file" id="fileInput" accept=".epub,.pdf,.txt,.docx,.mobi" style="display: none;">
                <div class="file-info" id="fileNameDisplay"></div>
                <div class="format-hint"><i class="fas fa-info-circle"></i> <span data-i18n="formatHint">最大 50MB，AI 将深度分析书籍核心内容</span></div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="analyzeBtn"><i class="fas fa-magic"></i> <span data-i18n="analyzeBtn">开始分析</span></button>
                <button class="btn btn-outline" id="resetBtn"><i class="fas fa-undo-alt"></i> <span data-i18n="resetBtn">重置</span></button>
            </div>
        </div>

        <div id="reportContainer" class="report-container" style="display: none;">
            <div class="report-header">
                <h2><i class="fas fa-book-open"></i> 《<span id="bookTitle">未知书籍</span>》 · <span data-i18n="reportHeader">渐进阅读报告</span></h2>
                <div class="export-btns">
                    <button class="btn btn-outline btn-sm" id="exportDocxBtn"><i class="fas fa-file-word"></i> <span data-i18n="exportDocx">导出 DOCX</span></button>
                    <button class="btn btn-outline btn-sm" id="exportPdfBtn"><i class="fas fa-file-pdf"></i> <span data-i18n="exportPdf">导出 PDF</span></button>
                </div>
            </div>
            <div id="analysisContent"></div>
            <div class="footer">
                <i class="fas fa-brain"></i> <span data-i18n="footer">分析由 DeepSeek AI 驱动，严格遵循 渐进阅读法（检视阅读→分析阅读→评论）</span>
            </div>
        </div>
    </div>

    <script>
        const I18N = {
            zh: {
                pageTitle: '帮你读书 - 渐进阅读法 | AI智能精读',
                heroTitle: '📖 帮你读书',
                badge: '⚡ 基于 DeepSeek AI + 渐进阅读法 · 智能精读引擎',
                intro: '书海千千万，哪本是你该读的呢？你是否拿不定主意，是否该花时间去完整阅读这本书，又或者你只是想知道这本书的核心内容？把书喂给我吧，基于《如何阅读一本书》中的四层阅读层次提取的阅读方法，我将给你一份详尽的阅读报告，看完你就能立刻做出决断了。',
                uploadPrompt: '点击或拖拽上传书籍文档',
                formats: '支持 EPUB、文字版 PDF、TXT、Word、MOBI',
                formatHint: '最大 50MB，AI 将深度分析书籍核心内容',
                analyzeBtn: '开始分析',
                resetBtn: '重置',
                reportHeader: '渐进阅读报告',
                loading1: '🤖 AI 正在深度分析书籍内容，严格按照 渐进阅读法生成报告...',
                loading2: '两段式分析（先挑关键章节、再生成报告），约需 1-3 分钟，请耐心等待',
                footer: '分析由 DeepSeek AI 驱动，严格遵循 渐进阅读法（检视阅读→分析阅读→评论）',
                needFile: '请先选择一本书籍文件',
                badFormat: '暂支持 EPUB、文字版 PDF、TXT、Word 或 MOBI 文件',
                selected: '已选择',
                analyzeFail: '分析失败',
                requestFail: '请求失败',
                exportDocx: '导出 DOCX',
                exportPdf: '导出 PDF'
            },
            en: {
                pageTitle: 'Help You Read - Progressive Reading | AI Smart Reading',
                heroTitle: '📖 Help You Read',
                badge: '⚡ Powered by DeepSeek AI + Progressive Reading',
                intro: 'With thousands of books out there, which one should you actually read? Hesitating over whether to invest the time reading it cover to cover, or just want to grasp its core ideas? Feed the book to me — based on the reading method distilled from the four levels of reading in "How to Read a Book", I\'ll give you a detailed reading report so you can decide right away.',
                uploadPrompt: 'Click or drag to upload a book',
                formats: 'Supports EPUB, text PDF, TXT, Word, MOBI',
                formatHint: 'Up to 50MB, AI analyzes the core content of the book',
                analyzeBtn: 'Analyze',
                resetBtn: 'Reset',
                reportHeader: 'Progressive Reading Report',
                loading1: '🤖 AI is analyzing the book following the Progressive Reading method...',
                loading2: 'Two-pass analysis (pick key chapters first, then generate report), takes 1-3 min',
                footer: 'Driven by DeepSeek AI, following the Progressive Reading (Inspectional → Analytical → Critical)',
                needFile: 'Please select a book file first',
                badFormat: 'Please upload EPUB, text PDF, TXT, Word or MOBI',
                selected: 'Selected',
                analyzeFail: 'Analysis failed',
                requestFail: 'Request failed',
                exportDocx: 'Export DOCX',
                exportPdf: 'Export PDF'
            }
        };

        let currentLang = localStorage.getItem('lang') || 'zh';
        let selectedFile = null;
        let currentMarkdown = '';

        function t(key) {
            return (I18N[currentLang] && I18N[currentLang][key]) || key;
        }

        function applyLang() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.getAttribute('data-i18n'));
            });
            document.title = t('pageTitle');
            document.querySelectorAll('.lang-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === currentLang);
            });
            if (selectedFile) {
                fileNameDisplay.innerHTML = `✅ ${t('selected')}: ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
            }
        }

        document.querySelectorAll('.lang-btn').forEach(b => {
            b.addEventListener('click', () => {
                currentLang = b.dataset.lang;
                localStorage.setItem('lang', currentLang);
                applyLang();
            });
        });

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resetBtn = document.getElementById('resetBtn');
        const reportContainer = document.getElementById('reportContainer');
        const bookTitleSpan = document.getElementById('bookTitle');
        const analysisContentDiv = document.getElementById('analysisContent');

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#3b82f6';
            uploadArea.style.background = '#f0f9ff';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#cbd5e1';
            uploadArea.style.background = '#fafcff';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#cbd5e1';
            uploadArea.style.background = '#fafcff';
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            const validExtensions = ['.epub', '.pdf', '.txt', '.docx', '.mobi'];
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            if (!validExtensions.includes(ext)) {
                alert(t('badFormat'));
                return;
            }
            selectedFile = file;
            fileNameDisplay.innerHTML = `✅ ${t('selected')}: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
        }

        resetBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            fileNameDisplay.innerHTML = '';
            reportContainer.style.display = 'none';
        });

        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) {
                alert(t('needFile'));
                return;
            }

            reportContainer.style.display = 'block';
            analysisContentDiv.innerHTML = `
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>${t('loading1')}</p>
                <p style="font-size: 0.8rem; color: #64748b; margin-top: 0.5rem;">${t('loading2')}</p>
            </div>
        `;
            bookTitleSpan.innerText = selectedFile.name.replace(/\.[^/.]+$/, '');

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    currentMarkdown = result.analysis;
                    const htmlContent = marked.parse(result.analysis);
                    analysisContentDiv.innerHTML = `<div class="analysis-content">${htmlContent}</div>`;
                } else {
                    analysisContentDiv.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-triangle"></i> ${t('analyzeFail')}: ${result.error}</div>`;
                }
            } catch (error) {
                analysisContentDiv.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-triangle"></i> ${t('requestFail')}: ${error.message}</div>`;
            }
        });

        const exportDocxBtn = document.getElementById('exportDocxBtn');
        const exportPdfBtn = document.getElementById('exportPdfBtn');

        exportDocxBtn.addEventListener('click', async () => {
            if (!currentMarkdown) return;
            const res = await fetch('/export-docx', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ markdown: currentMarkdown, title: bookTitleSpan.innerText })
            });
            if (!res.ok) { alert('导出失败'); return; }
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = bookTitleSpan.innerText + '.docx';
            a.click();
            URL.revokeObjectURL(url);
        });

        exportPdfBtn.addEventListener('click', () => window.print());

        applyLang();
    </script>
</body>

</html>
